<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" stroke="url(#pinkGrad)" stroke-width="8" fill="none" opacity="0.4" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="url(#pinkGrad)" opacity="0.15" filter="url(#pinkGlow)" />
  <circle cx="256" cy="256" r="130" fill="url(#pinkGrad)" opacity="0.2" />

  <!-- Center Salad Bowl / Leaf Emblem -->
  <g transform="translate(106, 106) scale(0.6)">
    <!-- Bowl -->
    <path d="M50,230 C50,380 450,380 450,230 Z" fill="url(#pinkGrad)" />
    <!-- Leaf 1 -->
    <path d="M250,50 C180,120 180,220 250,220 C320,220 320,120 250,50 Z" fill="#86efac" opacity="0.9" />
    <!-- Leaf 2 -->
    <path d="M170,100 C110,160 120,230 190,220 C240,210 220,130 170,100 Z" fill="#4ade80" opacity="0.8" />
    <!-- Leaf 3 -->
    <path d="M330,100 C390,160 380,230 310,220 C260,210 280,130 330,100 Z" fill="#22c55e" opacity="0.8" />
  </g>

  <!-- Text Badge -->
  <text x="256" y="440" text-anchor="middle" fill="#ffffff" font-family="Outfit, sans-serif" font-weight="800" font-size="42" letter-spacing="2">
    NUTRI<tspan fill="#ec4899">CRIS</tspan>
  </text>
</svg>